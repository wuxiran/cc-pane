<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f4efe5;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .scene {
      width: min(100vw, 1100px);
      aspect-ratio: 16 / 10;
      min-height: 360px;
      overflow: hidden;
      position: relative;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(47, 62, 70, .24);
      background: #a9dce4;
    }
    svg { display: block; width: 100%; height: 100%; }
    .bird-group { animation: ride 1.1s ease-in-out infinite; transform-origin: 52% 72%; }
    .pedal-leg { animation: pedal 1.1s linear infinite; transform-origin: 50% 50%; }
    .wheel { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .cloud { animation: drift 24s linear infinite; }
    .cloud.slow { animation-duration: 34s; animation-delay: -11s; }
    .feather { animation: feather 1.1s ease-in-out infinite; transform-origin: 50% 80%; }
    @keyframes ride { 0%,100% { transform: translateY(0) rotate(-.7deg); } 50% { transform: translateY(-5px) rotate(.7deg); } }
    @keyframes pedal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(1160px); } }
    @keyframes feather { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .bird-group, .pedal-leg, .wheel, .cloud, .feather { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="鹈鹕骑自行车的二维动画">
    <svg viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只戴着蓝色帽子的鹈鹕沿着海边骑着红色自行车。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8bcbd8"/><stop offset="1" stop-color="#f6d7ac"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55b9c4"/><stop offset="1" stop-color="#23889b"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#686c72"/><stop offset="1" stop-color="#3e444c"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="12"/>
        </filter>
      </defs>

      <rect width="1000" height="625" fill="url(#sky)"/>
      <circle cx="820" cy="116" r="54" fill="#ffe5a8" opacity=".9"/>
      <g class="cloud" fill="#fff8e9" opacity=".72">
        <path d="M-40 150c35-38 76-32 98-3 27-24 76-10 80 26H-40z"/>
        <path d="M365 96c28-32 66-25 82 2 28-17 65 1 67 30H348z"/>
      </g>
      <g class="cloud slow" fill="#fff8e9" opacity=".58">
        <path d="M760 196c28-34 70-26 86 4 32-19 72 4 74 34H741z"/>
      </g>

      <path d="M0 280 Q115 222 222 276 T440 270 T660 278 T880 258 T1100 270 V388 H0Z" fill="#5d9da1" opacity=".75"/>
      <path d="M0 321 Q135 276 253 328 T502 323 T735 330 T1000 312 V421 H0Z" fill="#397f8d" opacity=".85"/>
      <path d="M0 362 Q140 332 280 370 T540 369 T805 355 T1000 367 V489 H0Z" fill="url(#sea)"/>
      <g fill="none" stroke="#b9edf0" stroke-width="5" opacity=".62">
        <path d="M30 402h135m44 0h94m48 0h142m52 0h112m58 0h122"/>
        <path d="M-20 440h160m55 0h116m70 0h151m48 0h140m53 0h149"/>
      </g>
      <path d="M0 458 Q160 429 330 466 T670 461 T1000 450 V625 H0Z" fill="#e7c58d"/>
      <path d="M0 503 Q170 480 360 513 T690 509 T1000 497 V625 H0Z" fill="url(#road)"/>
      <path d="M0 571 Q170 548 355 579 T700 573 T1000 559" fill="none" stroke="#f4d97e" stroke-width="8" stroke-dasharray="58 35" opacity=".9"/>
      <ellipse cx="520" cy="560" rx="220" ry="24" fill="#202d34" opacity=".22" filter="url(#soft)"/>

      <g class="bird-group">
        <!-- bicycle -->
        <g fill="none" stroke="#263d49" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <circle class="wheel" cx="375" cy="526" r="67" stroke="#e84d42" stroke-width="7"/>
          <circle class="wheel" cx="650" cy="526" r="67" stroke="#e84d42" stroke-width="7"/>
          <path d="M375 526L466 430 540 526 375 526 466 430 650 526 587 405h-62"/>
          <path d="M587 405l22-29m-34 28h43"/>
          <path d="M540 526l-13 30m-22-30h43"/>
        </g>
        <g class="wheel" fill="none" stroke="#f7b5a5" stroke-width="3" opacity=".9">
          <path d="M375 463v126m-63-63h126m-45-45l90 90m0-90l-90 90"/>
          <path d="M650 463v126m-63-63h126m-45-45l90 90m0-90l-90 90"/>
        </g>
        <circle cx="540" cy="526" r="13" fill="#f3b23f" stroke="#263d49" stroke-width="5"/>
        <g class="pedal-leg" fill="none" stroke="#263d49" stroke-width="7" stroke-linecap="round">
          <path d="M540 526l-26-35m26 35l35 24"/><path d="M508 489h-20m67 61h20"/>
        </g>

        <!-- pelican body -->
        <ellipse cx="505" cy="330" rx="112" ry="107" fill="#f6f1df" stroke="#263d49" stroke-width="7"/>
        <path class="feather" d="M435 293q-30 39-10 80 21-19 48-23" fill="#d8e2df" stroke="#263d49" stroke-width="6"/>
        <path d="M445 382q57 37 112 0" fill="none" stroke="#d8e2df" stroke-width="12" stroke-linecap="round"/>
        <path d="M476 412q20 26 45 0" fill="none" stroke="#263d49" stroke-width="7" stroke-linecap="round"/>
        <!-- neck and head -->
        <path d="M490 273q-8-72 43-92 57-20 81 31 14 30-8 65" fill="#f6f1df" stroke="#263d49" stroke-width="7"/>
        <path d="M508 176q29-38 77-18l-9-27q-55-25-90 20z" fill="#3979a7" stroke="#263d49" stroke-width="7" stroke-linejoin="round"/>
        <path d="M560 191q25-6 46 15" fill="none" stroke="#6ea9cb" stroke-width="7" stroke-linecap="round"/>
        <circle cx="579" cy="211" r="7" fill="#263d49"/>
        <path d="M604 226q48 2 105 32-44 31-108 21l-46-18z" fill="#ee9d62" stroke="#263d49" stroke-width="7" stroke-linejoin="round"/>
        <path d="M606 253q47 13 91 5" fill="none" stroke="#c76f4f" stroke-width="5" stroke-linecap="round"/>
        <!-- wing and handle -->
        <path d="M542 291q63 2 58 77-33 19-72-21z" fill="#d8e2df" stroke="#263d49" stroke-width="7"/>
        <path d="M575 367q31 16 35 39" fill="none" stroke="#263d49" stroke-width="7" stroke-linecap="round"/>
        <path d="M600 405l-13 8" stroke="#ee9d62" stroke-width="12" stroke-linecap="round"/>
        <!-- feet -->
        <path d="M480 407l-7 75m69-75l-4 75" stroke="#ee9d62" stroke-width="11" stroke-linecap="round"/>
        <path d="M468 481q17 11 34 0m23 0q17 11 34 0" fill="none" stroke="#263d49" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g fill="#fff8e9" opacity=".86">
        <circle cx="102" cy="530" r="4"/><circle cx="140" cy="515" r="3"/><circle cx="868" cy="480" r="4"/>
      </g>
    </svg>
  </main>
</body>
</html>
