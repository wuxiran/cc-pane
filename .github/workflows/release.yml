name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # 仓库的 .cargo/config.toml 把 target-dir 指到仓库外（`../cc-book-target`），
  # 那是为了避开本地 Vite watcher 遍历海量产物。CI 没有这个问题，且产物落在
  # workspace 外会让 actions/cache 的相对路径失配——这里显式拉回常规布局。
  #
  # ⚠️ 必须用绝对路径：相对值由 cargo 按**当前工作目录**解析，而 tauri 构建时
  # CWD 是 src-tauri/，会把产物写进 src-tauri/target/，导致 tauri-action 在
  # 仓库根的 target/ 下找不到 bundle（"No artifacts were found"）。
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate tauri.conf.json version
        run: |
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAURI_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate Cargo.toml version
        run: |
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate mobile pubspec version
        run: |
          MOBILE_VERSION=$(awk '/^version:/ { print $2; exit }' cc-panes-mobile/pubspec.yaml)
          MOBILE_VERSION=${MOBILE_VERSION%%+*}
          if [ "$MOBILE_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::cc-panes-mobile/pubspec.yaml version ($MOBILE_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate Chinese release notes
        run: node .github/scripts/extract-changelog.mjs "${{ steps.tag.outputs.version }}" > /dev/null

  prepare-release:
    name: Prepare one release draft
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or reuse the release draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl > release-api-url.txt 2> release-query-error.txt; then
            if ! grep -qi 'release not found' release-query-error.txt; then
              cat release-query-error.txt >&2
              exit 1
            fi
            node .github/scripts/extract-changelog.mjs "${TAG#v}" > release-notes.txt
            cat .github/release-installation.md >> release-notes.txt
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "CC-Panes $TAG" --notes-file release-notes.txt
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl > release-api-url.txt
          fi
          RELEASE_ID=$(gh api "$(cat release-api-url.txt)" --jq .id)
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    needs: [validate-version, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-latest
            platform_key: windows-x86_64
            args: --bundles nsis
          - platform: windows-latest
            label: windows-arm64
            platform_key: windows-aarch64
            args: --bundles nsis --target aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
          - platform: macos-latest
            label: macos-arm64
            platform_key: darwin-aarch64
            args: --bundles app,dmg
          - platform: macos-latest
            label: macos-x86_64
            platform_key: darwin-x86_64
            args: --bundles app,dmg --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-24.04
            label: linux-amd64
            platform_key: linux-x86_64
            args: --bundles deb appimage
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev patchelf libpipewire-0.3-dev libgbm-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.label }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-release-

      - name: Install dependencies
        run: npm ci

      # actions/cache 用 restore-keys 兜底会带回**旧版本**的 bundle 产物；
      # 下面的 updater 工件收集按「有 .sig 伴生」扫描，不清掉会把陈旧工件
      # 混进本次 latest.json。
      - name: Clean stale bundle outputs from cache
        shell: bash
        run: rm -rf "${CARGO_TARGET_DIR}/release/bundle" "${CARGO_TARGET_DIR}"/*/release/bundle || true

      # macOS 代码签名 + 公证：secrets 配置后自动生效（codesign→notarize→staple）。
      # 必须"非空才导出"——GHA 里未配置的 secret 展开成**空字符串**而非未设置，
      # tauri bundler 只查环境变量存在与否，拿空证书 security import 直接炸掉
      # 构建（v0.12.1 首跑实测）。需要 Apple Developer 账号：APPLE_CERTIFICATE 为
      # Developer ID Application 证书 .p12 的 base64；公证走 App Store Connect
      # API Key 三件套。
      - name: Enable macOS signing (only when secrets are configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          _APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          _APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          if [ -z "$_APPLE_CERTIFICATE" ]; then
            echo "Apple signing secrets not configured; building unsigned."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; do
            source_var="_${name}"
            value="${!source_var}"
            [ -n "$value" ] || continue
            {
              echo "${name}<<CCPANES_EOF"
              printf '%s\n' "$value"
              echo "CCPANES_EOF"
            } >> "$GITHUB_ENV"
          done
          echo "Apple signing enabled."

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # All platforms upload to the one prepared ID; parallel draft creation can split assets.
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          # latest.json 绝不能由五个并行 job 各自生成上传：tauri-action 的
          # merge 是无锁 read-modify-write，后完成者用旧快照覆盖先完成者
          # （v0.12.1 实测线上清单只剩 linux + windows-arm64 两平台，
          # v0.9.40 也曾丢 macOS 条目、靠 backfill-macos-updater.yml 手工补救）。
          # 各 job 只产出元数据工件，由下面串行的 publish-updater-json 聚合。
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # 收集本平台 updater 工件（.sig 伴生文件判定），自行上传资产
      # （macOS .app.tar.gz 无架构名会跨 job 同名互撞，脚本里按架构重命名），
      # 元数据交给 publish-updater-json 聚合。
      - name: Collect updater artifacts
        shell: bash
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          RUST_TARGET: ${{ matrix.rust_target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${GITHUB_REF#refs/tags/v}"
          node .github/scripts/collect-updater-metadata.mjs
          gh release upload "v${VERSION}" updater-upload/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform_key }}
          path: updater-metadata/*.json

  # latest.json 的唯一写者：等全部 build job 收尾后从元数据从零构建。
  # 部分平台构建失败时仍发布残缺清单（已构建平台的用户不陪葬），
  # 缺失平台打 ::warning:: 标注在 run 页面。
  publish-updater-json:
    name: Publish latest.json
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download updater metadata
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: metadata

      - name: Build and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          export TAG REPO="$GITHUB_REPOSITORY" VERSION="${TAG#v}"
          node .github/scripts/extract-changelog.mjs "$VERSION" > release-notes.txt
          gh release view "$TAG" --repo "$REPO" --json body --jq '.body | split("## macOS 安装说明")[1] // empty' > installation-notes.txt
          if [ -s installation-notes.txt ]; then
            printf '\n---\n\n## macOS 安装说明\n' >> release-notes.txt
            cat installation-notes.txt >> release-notes.txt
          fi
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.txt
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > release-body.txt
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > release-assets.txt
          node .github/scripts/merge-latest-json.mjs
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
          # tauri-action 可能把两个 mac job 未带架构名的 cc-panes.app.tar.gz
          # 也传上来（内容取决于哪个 job 后完成，不可信）——清理掉
          gh release delete-asset "$TAG" cc-panes.app.tar.gz --repo "$REPO" --yes 2>/dev/null || true
          gh release delete-asset "$TAG" cc-panes.app.tar.gz.sig --repo "$REPO" --yes 2>/dev/null || true

  windows-portable:
    name: Package Windows Portable
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Extract tag version
        id: tag
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # 绿色免安装版 = 已发布 x64 NSIS 安装包的原样解包重压缩（字节级同源，不重新构建）。
      # needs: build 保证 release 与 setup.exe 已就绪。
      - name: Download x64 setup from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "v${{ steps.tag.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cc-panes_${{ steps.tag.outputs.version }}_x64-setup.exe"

      - name: Repackage as portable zip
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          7z x "cc-panes_${VERSION}_x64-setup.exe" -oextracted -y > /dev/null
          mkdir CC-Panes-Portable
          cp -r extracted/binaries extracted/resources extracted/cc-panes.exe CC-Panes-Portable/
          # NSIS 运行时插件目录不属于应用本体
          cat > CC-Panes-Portable/README-portable.txt <<'EOF'
          CC-Panes 绿色免安装版 / Portable Edition
          ====================================================

          使用方法：解压到任意目录，双击 cc-panes.exe 运行。

          - 数据目录与安装版相同（%USERPROFILE%\.cc-panes\），
            删除程序目录不会丢失数据。
          - 与安装版共享数据目录与单实例锁，请勿同时运行已安装的 CC-Panes。
          - 应用内自动更新对免安装版无效；升级方式：下载新版 zip 覆盖解压。
          - Windows 10 若提示缺少 WebView2，请安装 Microsoft Edge WebView2 Runtime：
            https://developer.microsoft.com/microsoft-edge/webview2/

          Data directory: %USERPROFILE%\.cc-panes\ (same as the installer build).
          Do not run alongside an installed copy. In-app auto-update does not
          apply to the portable build - upgrade by extracting a newer zip.
          EOF
          7z a -tzip "cc-panes_${VERSION}_x64-portable.zip" CC-Panes-Portable -mx=7 > /dev/null
          7z l "cc-panes_${VERSION}_x64-portable.zip" | tail -2

      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "v${{ steps.tag.outputs.version }}" \
            "cc-panes_${{ steps.tag.outputs.version }}_x64-portable.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  mobile-apk:
    name: Build Mobile APK
    runs-on: ubuntu-24.04
    needs: [validate-version, prepare-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: cc-panes-mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_NAME="cc-panes-mobile_${{ steps.tag.outputs.version }}.apk"
          cp cc-panes-mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          gh release upload "v${{ steps.tag.outputs.version }}" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish complete release
    runs-on: ubuntu-latest
    needs: [build, windows-portable, mobile-apk, publish-updater-json]
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require successful CI for this exact commit
        timeout-minutes: 32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            if gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --limit 20 --json status,conclusion \
              --jq 'any(.[]; .status == "completed" and .conclusion == "success")' | grep -qx true; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::No successful CI run for release commit $GITHUB_SHA; release remains a draft."
          exit 1

      - name: Make the validated release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
