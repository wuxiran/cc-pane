name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # 仓库的 .cargo/config.toml 把 target-dir 指到仓库外（`../cc-book-target`），
  # 那是为了避开本地 Vite watcher 遍历海量产物。CI 没有这个问题，且产物落在
  # workspace 外会让 actions/cache 的相对路径失配——这里显式拉回常规布局。
  #
  # ⚠️ 必须用绝对路径：相对值由 cargo 按**当前工作目录**解析，而 tauri 构建时
  # CWD 是 src-tauri/，会把产物写进 src-tauri/target/，导致 tauri-action 在
  # 仓库根的 target/ 下找不到 bundle（"No artifacts were found"）。
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate tauri.conf.json version
        run: |
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAURI_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate Cargo.toml version
        run: |
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Validate mobile pubspec version
        run: |
          MOBILE_VERSION=$(awk '/^version:/ { print $2; exit }' cc-panes-mobile/pubspec.yaml)
          MOBILE_VERSION=${MOBILE_VERSION%%+*}
          if [ "$MOBILE_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::cc-panes-mobile/pubspec.yaml version ($MOBILE_VERSION) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    needs: validate-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-latest
            args: --bundles nsis
          - platform: windows-latest
            label: windows-arm64
            args: --bundles nsis --target aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
          - platform: macos-latest
            label: macos-arm64
            args: --bundles app,dmg
          - platform: macos-latest
            label: macos-x86_64
            args: --bundles app,dmg --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-24.04
            label: linux-amd64
            args: --bundles deb appimage
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev patchelf libpipewire-0.3-dev libgbm-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.label }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-release-

      - name: Install dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "CC-Panes v__VERSION__"
          releaseBody: |
            See the [CHANGELOG](https://github.com/wuxiran/cc-pane/blob/main/CHANGELOG.md) for details.

            ---

            ## macOS 安装说明

            由于应用未经 Apple 签名，macOS 可能提示"文件已损坏"或"无法验证开发者"。请使用以下任一方式解决：

            **方式一：终端命令（推荐）**
            ```bash
            xattr -cr /Applications/CC-Panes.app
            ```

            **方式二：右键打开**
            在 Finder 中按住 Control 键点击（或右键点击）应用图标，选择"打开"，在弹出的对话框中点击"打开"。

            **方式三：系统设置**
            打开"系统设置 → 隐私与安全性"，在底部找到被阻止的应用，点击"仍要打开"。

            ## Linux 安装说明

            **Deb 包（Ubuntu/Debian）：**
            ```bash
            sudo dpkg -i cc-panes_*.deb
            sudo apt-get install -f  # 安装缺少的依赖
            ```

            **AppImage：**
            ```bash
            chmod +x cc-panes_*.AppImage
            ./cc-panes_*.AppImage
            ```
          releaseDraft: false
          # tag 含 `-`（如 v0.12.0-beta.1）自动标 prerelease：GitHub 的 releases/latest
          # 排除 prerelease，稳定版用户的 updater（指向 latest/download/latest.json）
          # 不会被推 beta——beta 只面向手动下载者。
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  windows-portable:
    name: Package Windows Portable
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Extract tag version
        id: tag
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # 绿色免安装版 = 已发布 x64 NSIS 安装包的原样解包重压缩（字节级同源，不重新构建）。
      # needs: build 保证 release 与 setup.exe 已就绪。
      - name: Download x64 setup from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "v${{ steps.tag.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cc-panes_${{ steps.tag.outputs.version }}_x64-setup.exe"

      - name: Repackage as portable zip
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          7z x "cc-panes_${VERSION}_x64-setup.exe" -oextracted -y > /dev/null
          mkdir CC-Panes-Portable
          cp -r extracted/binaries extracted/resources extracted/cc-panes.exe CC-Panes-Portable/
          # NSIS 运行时插件目录不属于应用本体
          cat > CC-Panes-Portable/README-portable.txt <<'EOF'
          CC-Panes 绿色免安装版 / Portable Edition
          ====================================================

          使用方法：解压到任意目录，双击 cc-panes.exe 运行。

          - 数据目录与安装版相同（%USERPROFILE%\.cc-panes\），
            删除程序目录不会丢失数据。
          - 与安装版共享数据目录与单实例锁，请勿同时运行已安装的 CC-Panes。
          - 应用内自动更新对免安装版无效；升级方式：下载新版 zip 覆盖解压。
          - Windows 10 若提示缺少 WebView2，请安装 Microsoft Edge WebView2 Runtime：
            https://developer.microsoft.com/microsoft-edge/webview2/

          Data directory: %USERPROFILE%\.cc-panes\ (same as the installer build).
          Do not run alongside an installed copy. In-app auto-update does not
          apply to the portable build - upgrade by extracting a newer zip.
          EOF
          7z a -tzip "cc-panes_${VERSION}_x64-portable.zip" CC-Panes-Portable -mx=7 > /dev/null
          7z l "cc-panes_${VERSION}_x64-portable.zip" | tail -2

      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "v${{ steps.tag.outputs.version }}" \
            "cc-panes_${{ steps.tag.outputs.version }}_x64-portable.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  mobile-apk:
    name: Build Mobile APK
    runs-on: ubuntu-24.04
    needs: validate-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: cc-panes-mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_NAME="cc-panes-mobile_${{ steps.tag.outputs.version }}.apk"
          cp cc-panes-mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          # tauri-action 的 build job 负责创建 release；这里等它就绪后上传。
          # 上限 30 分钟：实测 windows 构建 16 分钟+ 才发布 release，10 分钟等不到（v0.12.0-beta.1 失败一次）
          for i in $(seq 1 180); do
            if gh release view "v${{ steps.tag.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release upload "v${{ steps.tag.outputs.version }}" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
