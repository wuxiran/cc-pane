[package]
name = "cc-panes-web"
version = "0.1.0"
description = "CC-Panes Web terminal server for Docker deployment"
authors = ["wuxiran"]
license = "MIT"
edition = "2021"

[features]
default = ["secret-service"]
# 把仓库根目录的 dist/（前端构建产物）编进二进制，用于远程服务器单文件部署。
embed-dist = []
# 桌面随包的 sidecar 保留系统密钥环；远程服务器构建用 --no-default-features 去掉 libdbus 依赖。
secret-service = ["cc-panes-core/secret-service"]

[dependencies]
cc-panes-core = { path = "../cc-panes-core", default-features = false }
cc-cli-adapters = { path = "../cc-cli-adapters" }
cc-memory = { path = "../cc-memory" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
parking_lot = "0.12"
dirs = "6"
anyhow = "1"
tokio-tungstenite = "0.27"
urlencoding = "2"
encoding_rs = "0.8"
chrono = "0.4"
rand = "0.8"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
