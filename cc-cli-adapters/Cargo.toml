[package]
name = "cc-cli-adapters"
version = "0.1.0"
edition = "2021"
description = "CLI tool adapter layer for CC-Panes"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
which = "7"
tracing = "0.1"
dirs = "6"

[dev-dependencies]
# 只有 cfg(any(windows, test)) 的 WSL trust key 逻辑用它：放普通依赖会在非 Windows 报 unused dependency。
cc-panes-paths = { path = "../cc-panes-paths" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
cc-panes-paths = { path = "../cc-panes-paths" }
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }
