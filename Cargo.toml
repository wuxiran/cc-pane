[workspace]
resolver = "2"
members = [
    "src-tauri",
    "cc-panes-core",
    "cc-panes-api",
    "cc-panes-daemon",
    "cc-panes-cli-hook",
    "cc-panes-ctl",
    "cc-panes-web",
    "cc-memory",
    "cc-memory-mcp",
    "cc-notify",
    "cc-cli-adapters",
]

# dev 构建的调试信息策略：自己的代码留行号级信息（够看栈回溯），依赖一律不生成。
# 默认 debug = 2 会给全部 914 个依赖生成完整调试信息——这是 target/debug/deps 膨胀到
# 上百 GB 的主因，且链接器每次都要读取并合并这些信息，拖慢每一次重新链接。
# 依赖代码基本不会单步进入，故收益远大于代价。需要调试某个依赖时临时改回即可。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

# Keep line tables for our release binaries. Retain matching PDB/debug files with future builds.
# lto + 单 codegen unit：跨 crate 内联，换发布构建慢几分钟。
# 不开 strip（要留 PDB 做崩溃分析），不开 panic = "abort"（core 用 catch_unwind 隔离
# listener / PTY 回调的 panic，abort 会让单点 panic 直接带走 app 或 daemon）。
[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
debug = 0
